<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMP Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1d1a41; --navy-2: #272350; --navy-3: #332e66;
      --peri: #818fd9; --peri-hi: #97a3e4; --peri-lo: #6c7ac6;
      --bone: #f4f0e9; --bone-dim: rgba(244,240,233,.7);
      --gold: #c9a961; --gold-hi: #e0ce7a;
      --red: #d94040; --green: #3cb97a;
      --card: rgba(255,255,255,.05);
      --border: rgba(255,255,255,.1);
      --r: 10px;
    }
    html, body { height: 100%; }
    body { font-family: 'Manrope', system-ui, sans-serif; background: var(--navy); color: var(--bone); min-height: 100vh; font-size: 14px; }
    #app { min-height: 100vh; display: flex; flex-direction: column; }

    .hdr { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 56px; background: rgba(255,255,255,.04); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .hdr-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
    .hdr-brand img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .hdr-badge { background: var(--peri-lo); color: var(--bone); font-size: 10px; font-weight: 700; letter-spacing: .1em; padding: 2px 7px; border-radius: 20px; text-transform: uppercase; }
    .btn-ghost { background: none; border: 1px solid var(--border); color: var(--bone-dim); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; transition: all .15s; }
    .btn-ghost:hover { border-color: var(--peri); color: var(--bone); }

    .tabs { display: flex; gap: 4px; padding: 16px 20px 0; border-bottom: 1px solid var(--border); }
    .tab { padding: 8px 16px; border-radius: 8px 8px 0 0; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: none; color: var(--bone-dim); font-family: inherit; transition: all .15s; }
    .tab.active { background: rgba(129,143,217,.18); color: var(--peri-hi); }
    .tab:hover:not(.active) { color: var(--bone); }

    .main { flex: 1; padding: 24px 20px; max-width: 1000px; width: 100%; margin: 0 auto; }

    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(129,143,217,.2), transparent); padding: 24px; }
    .login-card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 36px 32px; }
    .login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .login-logo img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
    .login-logo-text { font-size: 18px; font-weight: 700; }
    .login-logo-sub { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
    h2.login-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .login-sub { color: var(--bone-dim); font-size: 13px; margin-bottom: 24px; }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--bone-dim); }
    .field input, .field select, .field textarea { background: rgba(255,255,255,.07); border: 1px solid var(--border); color: var(--bone); border-radius: 8px; padding: 10px 14px; font-size: 14px; font-family: inherit; outline: none; width: 100%; transition: border-color .15s; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--peri); }
    .field textarea { resize: vertical; min-height: 80px; }
    .field select option { background: var(--navy-2); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; transition: all .15s; width: 100%; }
    .btn-primary { background: var(--peri); color: white; }
    .btn-primary:hover { background: var(--peri-hi); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-gold { background: var(--gold); color: var(--navy); }
    .btn-gold:hover { background: var(--gold-hi); }
    .btn-gold:disabled { opacity: .5; cursor: not-allowed; }
    .btn-danger { background: rgba(217,64,64,.18); color: #f48c8c; border: 1px solid rgba(217,64,64,.3); width: auto; }
    .btn-danger:hover { background: rgba(217,64,64,.3); }
    .btn-sm { padding: 6px 12px; font-size: 12px; width: auto; }

    .alert { padding: 12px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; margin-bottom: 16px; }
    .alert-error { background: rgba(217,64,64,.15); border: 1px solid rgba(217,64,64,.3); color: #f48c8c; }
    .alert-success { background: rgba(60,185,122,.15); border: 1px solid rgba(60,185,122,.3); color: #6ee4a4; }
    .alert-info { background: rgba(129,143,217,.15); border: 1px solid rgba(129,143,217,.3); color: var(--peri-hi); }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; }
    .stat-num { font-size: 28px; font-weight: 700; color: var(--peri-hi); }
    .stat-label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--bone-dim); margin-top: 2px; }

    .toolbar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
    .search { flex: 1; background: rgba(255,255,255,.07); border: 1px solid var(--border); color: var(--bone); border-radius: 8px; padding: 9px 14px; font-size: 14px; font-family: inherit; outline: none; }
    .search:focus { border-color: var(--peri); }
    .search::placeholder { color: var(--bone-dim); }
    .cat-filter { background: rgba(255,255,255,.07); border: 1px solid var(--border); color: var(--bone); border-radius: 8px; padding: 9px 12px; font-size: 13px; font-family: inherit; outline: none; cursor: pointer; }
    .cat-filter option { background: var(--navy-2); }

    .prod-list { display: flex; flex-direction: column; gap: 10px; }
    .prod-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); display: flex; align-items: center; gap: 14px; padding: 12px 14px; transition: border-color .15s; }
    .prod-card:hover { border-color: rgba(129,143,217,.35); }
    .prod-thumb { width: 54px; height: 70px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--navy-3); }
    .prod-info { flex: 1; min-width: 0; }
    .prod-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .prod-meta { font-size: 12px; color: var(--bone-dim); margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
    .prod-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .price-display { font-size: 15px; font-weight: 700; color: var(--gold); cursor: pointer; padding: 4px 8px; border-radius: 6px; border: 1px solid transparent; transition: all .15s; }
    .price-display:hover { border-color: var(--border); background: rgba(255,255,255,.05); }
    .price-input { background: rgba(255,255,255,.07); border: 1px solid var(--peri); color: var(--bone); border-radius: 6px; padding: 4px 8px; font-size: 14px; font-family: inherit; font-weight: 700; outline: none; width: 110px; }
    .badge { font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 2px 7px; border-radius: 20px; text-transform: uppercase; }
    .badge-new { background: rgba(60,185,122,.18); color: #6ee4a4; border: 1px solid rgba(60,185,122,.3); }
    .badge-cat { background: rgba(129,143,217,.18); color: var(--peri-hi); border: 1px solid rgba(129,143,217,.2); }
    .toggle { width: 36px; height: 20px; border-radius: 20px; border: none; cursor: pointer; background: rgba(255,255,255,.15); position: relative; transition: background .2s; flex-shrink: 0; }
    .toggle.on { background: var(--green); }
    .toggle::after { content: ''; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: white; transition: transform .2s; }
    .toggle.on::after { transform: translateX(16px); }
    .icon-btn-sm { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border); background: none; color: var(--bone-dim); cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: all .15s; }
    .icon-btn-sm:hover { border-color: #f48c8c; color: #f48c8c; }

    .add-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .drop-zone { border: 2px dashed var(--border); border-radius: 12px; aspect-ratio: 3/4; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all .2s; text-align: center; padding: 20px; position: relative; overflow: hidden; }
    .drop-zone:hover, .drop-zone.drag-over { border-color: var(--peri); background: rgba(129,143,217,.08); }
    .drop-zone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
    .drop-zone-label { color: var(--bone-dim); font-size: 13px; pointer-events: none; }
    .drop-icon { font-size: 32px; margin-bottom: 8px; }
    #fileInput { display: none; }

    .settings-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; margin-bottom: 16px; }
    .settings-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 14px; color: var(--peri-hi); }
    .token-display { font-family: monospace; font-size: 12px; color: var(--bone-dim); word-break: break-all; background: rgba(0,0,0,.2); padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
    .instructions { background: rgba(129,143,217,.1); border: 1px solid rgba(129,143,217,.2); border-radius: 8px; padding: 14px 16px; font-size: 13px; line-height: 1.7; color: var(--bone-dim); }
    .instructions a { color: var(--peri-hi); }
    .instructions ol { padding-left: 20px; }

    .progress-bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; margin-bottom: 8px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--peri), var(--gold)); transition: width .3s; border-radius: 2px; }
    .progress-label { font-size: 12px; color: var(--bone-dim); }

    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .modal-card { background: var(--navy-2); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; width: 100%; max-width: 340px; text-align: center; }
    .modal-card h3 { font-size: 17px; margin-bottom: 10px; }
    .modal-card p { color: var(--bone-dim); font-size: 13px; margin-bottom: 24px; }
    .modal-btns { display: flex; gap: 10px; }

    .empty { text-align: center; padding: 60px 20px; color: var(--bone-dim); }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }

    .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); border-top-color: white; animation: spin .6s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-full { min-height: 200px; display: flex; align-items: center; justify-content: center; color: var(--bone-dim); gap: 10px; }

    @media (max-width: 640px) {
      .add-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr 1fr; }
      .prod-actions { flex-wrap: wrap; justify-content: flex-end; }
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>
// =====================================================================
// CONFIG
// =====================================================================
const ADMIN_EMAIL = 'anthonentmichael@gmail.com'
const REPO = 'zaddywebbuilds/bmpclothing'
const TEMP_PASS_HASH = 'dbd8622508d1c46c918d07fcd5db200eaedf77301bfe576f3a3d5af2143050a9'
const CATEGORIES = [
  { key: 'long-gowns', name: 'Long Gowns' },
  { key: 'short-gowns', name: 'Short Gowns' },
  { key: 'jumpsuits', name: 'Jumpsuits' },
  { key: 'tops', name: 'Tops' },
  { key: 'pants-and-tops', name: 'Pants & Tops' },
  { key: 'skirts-and-tops', name: 'Skirts & Tops' },
]
const IMG_WIDTHS = [480, 960, 1440]

// =====================================================================
// STATE
// =====================================================================
let S = {
  view: 'login', tab: 'products',
  products: null, catalog: null,
  productsSha: null, catalogSha: null,
  search: '', catFilter: '',
  error: null, msg: null,
  loading: false, saving: false,
  saveProgress: 0, saveStep: '',
  editingPriceSlug: null, deleteConfirm: null,
  addImg: null, addForm: {},
}

// =====================================================================
// AUTH / STORAGE
// =====================================================================
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('')
}
const getStoredHash = () => localStorage.getItem('bmp_admin_hash')
const setStoredHash = h => localStorage.setItem('bmp_admin_hash', h)
const isPassChanged = () => localStorage.getItem('bmp_admin_changed') === 'true'
const markPassChanged = () => localStorage.setItem('bmp_admin_changed', 'true')
const isAuthed = () => sessionStorage.getItem('bmp_admin_ok') === 'true'
const markAuthed = () => sessionStorage.setItem('bmp_admin_ok', 'true')
const clearAuth = () => sessionStorage.removeItem('bmp_admin_ok')
const getToken = () => localStorage.getItem('bmp_admin_token') || ''
const setToken = t => localStorage.setItem('bmp_admin_token', t)

// =====================================================================
// GITHUB API
// =====================================================================
function ghHeaders() {
  return { Authorization: `Bearer ${getToken()}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
}
async function ghGet(path) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, { headers: ghHeaders() })
  if (!r.ok) throw new Error(`GitHub ${r.status} on ${path}`)
  return r.json()
}
async function ghPut(path, content64, message, sha) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    method: 'PUT', headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, content: content64, ...(sha ? { sha } : {}) })
  })
  if (!r.ok) { const t = await r.text(); throw new Error(`GitHub ${r.status}: ${t}`) }
  return r.json()
}
function toBase64(str) {
  // handles Unicode in JSON
  return btoa(unescape(encodeURIComponent(str)))
}
function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader()
    fr.onload = () => res(fr.result.split(',')[1])
    fr.onerror = rej
    fr.readAsDataURL(blob)
  })
}

// =====================================================================
// DATA LOADING
// =====================================================================
async function loadProducts() {
  const [pd, cd] = await Promise.all([ghGet('content/products.json'), ghGet('src/data/catalog.json')])
  S.products = JSON.parse(atob(pd.content.replace(/\n/g,'')))
  S.catalog = JSON.parse(atob(cd.content.replace(/\n/g,'')))
  S.productsSha = pd.sha
  S.catalogSha = cd.sha
}

// =====================================================================
// IMAGE PROCESSING (canvas → WebP at multiple widths)
// =====================================================================
function loadImgElement(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file)
    const img = new Image()
    img.onload = () => { URL.revokeObjectURL(url); res(img) }
    img.onerror = rej
    img.src = url
  })
}

async function resizeToBlob(imgEl, tw, th) {
  const canvas = document.createElement('canvas')
  canvas.width = tw; canvas.height = th
  canvas.getContext('2d').drawImage(imgEl, 0, 0, tw, th)
  // prefer WebP, fall back to JPEG
  const blob = await new Promise(res => canvas.toBlob(b => b ? res(b) : null, 'image/webp', 0.88))
  if (blob) return { blob, ext: 'webp' }
  return new Promise(res => canvas.toBlob(b => res({ blob: b, ext: 'jpg' }), 'image/jpeg', 0.88))
}

async function processAndUploadImages(slug, category, file, onStep) {
  const imgEl = await loadImgElement(file)
  const W = imgEl.naturalWidth, H = imgEl.naturalHeight
  const widths = [...new Set(IMG_WIDTHS.filter(w => w < W).concat([Math.min(W, 1800)]))].sort((a,b)=>a-b)
  const mediaId = `products/${category}/${slug}-1`

  for (let i = 0; i < widths.length; i++) {
    const tw = widths[i]
    const th = Math.round(H * tw / W)
    onStep(`Uploading ${tw}px image… (${i+1}/${widths.length})`, (i / widths.length) * 0.8)
    const { blob, ext } = await resizeToBlob(imgEl, tw, th)
    const b64 = await blobToBase64(blob)
    await ghPut(`public/assets/bmp/${mediaId}-${tw}.${ext}`, b64, `upload: ${slug} image ${tw}px`)
  }
  return { mediaId, w: W, h: H, widths }
}

// =====================================================================
// SAVE HELPERS
// =====================================================================
async function saveProductsJson(commitMsg) {
  const c64 = toBase64(JSON.stringify(S.products, null, 1))
  await ghPut('content/products.json', c64, commitMsg, S.productsSha)
  const fresh = await ghGet('content/products.json')
  S.productsSha = fresh.sha
}

async function saveCatalogJson(commitMsg) {
  const c64 = toBase64(JSON.stringify(S.catalog, null, 1))
  await ghPut('src/data/catalog.json', c64, commitMsg, S.catalogSha)
  const fresh = await ghGet('src/data/catalog.json')
  S.catalogSha = fresh.sha
}

// =====================================================================
// HELPERS
// =====================================================================
function slugify(s) { return s.toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-') }
function fmtPrice(n) { return '₦' + Number(n).toLocaleString('en-NG') }
function catName(key) { return (CATEGORIES.find(c => c.key === key)||{}).name || key }

// =====================================================================
// RENDER
// =====================================================================
const app = document.getElementById('app')

function render() {
  if (!isAuthed()) {
    app.innerHTML = S.view === 'change-password' ? renderChangePassword() : renderLogin()
    return S.view === 'change-password' ? bindChangePassword() : bindLogin()
  }
  if (!getToken()) { app.innerHTML = renderTokenSetup(); return bindTokenSetup() }
  if (S.view === 'change-password') { app.innerHTML = `<div class="login-wrap">${renderChangePwCard()}</div>`; return bindChangePassword() }
  app.innerHTML = renderDashboard()
  bindDashboard()
}

// ---- LOGIN ----
function renderLogin() {
  return `<div class="login-wrap"><div class="login-card">
    <div class="login-logo"><img src="/assets/bmp/brand/logo.jpg" onerror="this.style.display='none'">
      <div><div class="login-logo-text">BMP Clothings</div><div class="login-logo-sub">Admin Portal</div></div></div>
    <h2 class="login-title">Welcome back</h2>
    <p class="login-sub">Sign in to manage your products and prices.</p>
    ${S.error?`<div class="alert alert-error">${S.error}</div>`:''}
    <div class="field"><label>Email address</label><input id="l-email" type="email" value="${ADMIN_EMAIL}" autocomplete="email"></div>
    <div class="field"><label>Password</label><input id="l-pass" type="password" placeholder="Enter password" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="l-submit">${S.loading?'<span class="spinner"></span>':'Sign in'}</button>
  </div></div>`
}

function bindLogin() {
  const btn = document.getElementById('l-submit')
  const passEl = document.getElementById('l-pass')
  async function doLogin() {
    const email = document.getElementById('l-email').value.trim()
    const pw = passEl.value
    if (email !== ADMIN_EMAIL) { S.error='Unknown email address.'; render(); return }
    if (!pw) { S.error='Please enter your password.'; render(); return }
    S.loading=true; S.error=null; render()
    const h = await sha256(pw)
    const stored = getStoredHash(), changed = isPassChanged()
    let ok=false, needsChange=false
    if (!changed) {
      if (h===TEMP_PASS_HASH) { ok=true; needsChange=true }
      else { S.error='Incorrect password.'; S.loading=false; render(); return }
    } else {
      if (stored && h===stored) { ok=true }
      else if (h===TEMP_PASS_HASH) { ok=true; needsChange=true }
      else { S.error='Incorrect password.'; S.loading=false; render(); return }
    }
    S.loading=false
    markAuthed()
    if (needsChange) { S.view='change-password'; render(); return }
    S.view='dashboard'; render()
  }
  btn.addEventListener('click', doLogin)
  passEl.addEventListener('keydown', e => e.key==='Enter' && doLogin())
}

// ---- CHANGE PASSWORD ----
function renderChangePwCard() {
  return `<div class="login-card" style="max-width:400px">
    <div class="login-logo"><img src="/assets/bmp/brand/logo.jpg" onerror="this.style.display='none'"><div><div class="login-logo-text">BMP Admin</div></div></div>
    <h2 class="login-title">Set your password</h2>
    <p class="login-sub">You're using the temporary password. Set a new one to continue.</p>
    ${S.error?`<div class="alert alert-error">${S.error}</div>`:''}
    <div class="field"><label>New password</label><input id="np1" type="password" placeholder="At least 8 characters" autocomplete="new-password"></div>
    <div class="field"><label>Confirm password</label><input id="np2" type="password" placeholder="Repeat password" autocomplete="new-password"></div>
    <button class="btn btn-gold" id="np-save">Set password &amp; continue</button>
  </div>`
}
function renderChangePassword() { return `<div class="login-wrap">${renderChangePwCard()}</div>` }
function bindChangePassword() {
  document.getElementById('np-save').addEventListener('click', async () => {
    const p1=document.getElementById('np1').value, p2=document.getElementById('np2').value
    if (p1.length<8) { S.error='Password must be at least 8 characters.'; render(); return }
    if (p1!==p2) { S.error='Passwords do not match.'; render(); return }
    setStoredHash(await sha256(p1)); markPassChanged()
    S.error=null; S.view='dashboard'; render()
  })
}

// ---- TOKEN SETUP ----
function renderTokenSetup() {
  return `<div class="login-wrap"><div class="login-card" style="max-width:460px">
    <div class="login-logo"><img src="/assets/bmp/brand/logo.jpg" onerror="this.style.display='none'">
      <div><div class="login-logo-text">BMP Admin</div><div class="login-logo-sub">One-time setup</div></div></div>
    <h2 class="login-title">Connect to GitHub</h2>

      <ol>
        <li>Go to <a href="https://github.com/settings/tokens?type=beta" target="_blank">github.com → Settings → Developer settings → Fine-grained tokens</a></li>
        <li>Click <strong>Generate new token</strong></li>
        <li>Name it <strong>BMP Admin</strong>, expiry <strong>1 year</strong></li>
        <li>Resource owner: <strong>zaddywebbuilds</strong></li>
        <li>Repository access: <strong>Only select repositories</strong> → choose <strong>bmpclothing</strong></li>
        <li>Permissions → Contents → <strong>Read and write</strong></li>

function bindTokenSetup() {
  document.getElementById('gh-save').addEventListener('click', async () => {
    const tok=document.getElementById('gh-tok').value.trim()

    S.loading=true; S.error=null; render()

// ---- PRODUCTS TAB ----
function renderProductsTab() {
  if (S.loading && !S.products) return `<div class="loading-full"><span class="spinner"></span> Loading products…</div>`
  if (!S.products) return `<div class="loading-full">Loading…</div>`
  const all = S.catalog ? S.catalog.products : S.products.products
  const filtered = all.filter(p => {
    const q=S.search.toLowerCase()
    if (q && !p.title.toLowerCase().includes(q)) return false
    if (S.catFilter && p.category!==S.catFilter) return false
    return true
  })
  const newInCount = all.filter(p=>p.newIn).length
  const prices = all.map(p=>p.price).filter(Boolean)
  const avg = prices.length ? Math.round(prices.reduce((a,b)=>a+b,0)/prices.length) : 0
  return `
    <div class="stats">
      <div class="stat-card"><div class="stat-num">${all.length}</div><div class="stat-label">Total pieces</div></div>
      <div class="stat-card"><div class="stat-num">${newInCount}</div><div class="stat-label">New in</div></div>
      <div class="stat-card"><div class="stat-num">${fmtPrice(avg)}</div><div class="stat-label">Avg price</div></div>
    </div>
    <div class="toolbar">
      <input class="search" id="prod-search" placeholder="Search products…" value="${S.search}">
      <select class="cat-filter" id="cat-filter">
        <option value="">All categories</option>
        ${CATEGORIES.map(c=>`<option value="${c.key}"${S.catFilter===c.key?' selected':''}>${c.name}</option>`).join('')}
      </select>
    </div>
    <div class="prod-list">
      ${filtered.length===0 ? '<div class="empty"><div class="empty-icon">🔍</div>No products match your search.</div>' : filtered.map(renderProdCard).join('')}
    </div>`
}

function renderProdCard(p) {
  const mediaKey = (p.images||[])[0] || ''
  const thumbSrc = mediaKey
    ? `https://raw.githubusercontent.com/${REPO}/main/public/assets/bmp/${mediaKey}-480.webp`
    : '/assets/bmp/brand/og-image.jpg'
  const isEditing = S.editingPriceSlug===p.slug
  return `<div class="prod-card" data-slug="${p.slug}">
    <img class="prod-thumb" src="${thumbSrc}" onerror="this.src='/assets/bmp/brand/og-image.jpg'" loading="lazy">
    <div class="prod-info">
      <div class="prod-name">${p.title}</div>
      <div class="prod-meta">
        <span class="badge badge-cat">${catName(p.category)}</span>
        ${p.newIn?'<span class="badge badge-new">New In</span>':''}
      </div>
    </div>
    <div class="prod-actions">
      ${isEditing
        ? `<div style="display:flex;gap:6px;align-items:center">
            <input class="price-input" id="pi-${p.slug}" value="${p.price}" type="number" min="0">
            <button class="btn btn-sm btn-primary save-price-btn" data-slug="${p.slug}">Save</button>
            <button class="btn btn-sm btn-ghost cancel-price-btn" data-slug="${p.slug}">✕</button>
           </div>`
        : `<span class="price-display edit-price-btn" data-slug="${p.slug}" title="Click to edit">${fmtPrice(p.price)}</span>`}
      <button class="toggle${p.newIn?' on':''} toggle-newin-btn" data-slug="${p.slug}" title="Toggle New In"></button>
      <button class="icon-btn-sm delete-btn" data-slug="${p.slug}" title="Delete">🗑</button>
    </div>
  </div>`
}

// =====================================================================
// BIND DASHBOARD
// =====================================================================
function bindDashboard() {
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', async () => {
    if (t.dataset.tab === S.tab) return
    S.tab=t.dataset.tab; S.error=null; S.msg=null; render()
    if (S.tab==='products' && !S.products) {
      S.loading=true; render()
      try { await loadProducts() } catch(e) { S.error='Could not load: '+e.message }
      S.loading=false; render()
    }
  }))
  document.getElementById('logout-btn')?.addEventListener('click', () => { clearAuth(); S.products=null; S.catalog=null; S.view='login'; render() })
  if (S.tab==='products') bindProductsTab()
  if (S.tab==='add') bindAddTab()
  if (S.tab==='settings') bindSettingsTab()
  if (S.deleteConfirm) bindModal()
}

// ---- PRODUCTS ----
function bindProductsTab() {
  document.getElementById('prod-search')?.addEventListener('input', e => { S.search=e.target.value; render() })
  document.getElementById('cat-filter')?.addEventListener('change', e => { S.catFilter=e.target.value; render() })

  document.querySelectorAll('.edit-price-btn').forEach(b => b.addEventListener('click', () => { S.editingPriceSlug=b.dataset.slug; S.msg=null; render() }))
  document.querySelectorAll('.cancel-price-btn').forEach(b => b.addEventListener('click', () => { S.editingPriceSlug=null; render() }))
  document.querySelectorAll('.save-price-btn').forEach(b => b.addEventListener('click', async () => {
    const slug=b.dataset.slug, val=Number(document.getElementById(`pi-${slug}`).value)
    if (!val||val<=0) { S.error='Enter a valid price.'; render(); return }
    S.saving=true; S.error=null; render()
    try {
      // update both products.json and catalog.json
      const pProd=S.products.products.find(x=>x.slug===slug)
      const pCat=S.catalog.products.find(x=>x.slug===slug)
      if (pProd) pProd.price=val
      if (pCat) pCat.price=val
      await saveProductsJson(`update price: ${slug} → ${fmtPrice(val)}`)
      await saveCatalogJson(`update price: ${slug} → ${fmtPrice(val)}`)
      S.editingPriceSlug=null; S.msg=`Price updated to ${fmtPrice(val)}!`
    } catch(e) { S.error='Save failed: '+e.message }
    S.saving=false; render()
  }))
  document.querySelectorAll('.price-input').forEach(inp => {
    const card=inp.closest('.prod-card')
    inp.addEventListener('keydown', e => {
      if (e.key==='Enter') card.querySelector('.save-price-btn')?.click()
      if (e.key==='Escape') card.querySelector('.cancel-price-btn')?.click()
    })
  })

  document.querySelectorAll('.toggle-newin-btn').forEach(b => b.addEventListener('click', async () => {
    const slug=b.dataset.slug
    const pP=S.products.products.find(x=>x.slug===slug)
    const pC=S.catalog.products.find(x=>x.slug===slug)
    const newVal=!((pP||pC||{}).newIn)
    if (pP) pP.newIn=newVal
    if (pC) pC.newIn=newVal
    b.classList.toggle('on', newVal)
    try {
      await saveProductsJson(`update: ${newVal?'mark':'unmark'} ${slug} as new in`)
      await saveCatalogJson(`update: ${newVal?'mark':'unmark'} ${slug} as new in`)
      S.msg=`${newVal?'Marked as New In':'Removed from New In'}`; render()
    } catch(e) {
      if (pP) pP.newIn=!newVal
      if (pC) pC.newIn=!newVal
      S.error='Save failed: '+e.message; render()
    }
  }))

  document.querySelectorAll('.delete-btn').forEach(b => b.addEventListener('click', () => { S.deleteConfirm=b.dataset.slug; render() }))
}

// ---- ADD ----
function bindAddTab() {
  const dz=document.getElementById('drop-zone'), fi=document.getElementById('fileInput')
  function handleFile(file) {
    if (!file||!file.type.startsWith('image/')) { S.error='Please select an image file.'; render(); return }
    if (file.size>15*1024*1024) { S.error='Image too large. Max 15 MB.'; render(); return }
    S.addImg={file, preview:URL.createObjectURL(file)}; S.error=null; render()
  }
  document.getElementById('pick-img-btn')?.addEventListener('click', ()=>fi.click())
  dz?.addEventListener('click', ()=>fi.click())
  fi?.addEventListener('change', e=>handleFile(e.target.files[0]))
  dz?.addEventListener('dragover', e=>{e.preventDefault();dz.classList.add('drag-over')})
  dz?.addEventListener('dragleave', ()=>dz.classList.remove('drag-over'))
  dz?.addEventListener('drop', e=>{e.preventDefault();dz.classList.remove('drag-over');handleFile(e.dataTransfer.files[0])})

  ;['af-title','af-cat','af-price','af-desc'].forEach(id=>document.getElementById(id)?.addEventListener('input',e=>{
    const k={'af-title':'title','af-cat':'category','af-price':'price','af-desc':'description'}[id]
    S.addForm[k]=e.target.value
  }))
  ;['af-newin','af-pick'].forEach(id=>document.getElementById(id)?.addEventListener('change',e=>{
    S.addForm[id==='af-newin'?'newIn':'pick']=e.target.checked
  }))

  document.getElementById('add-submit-btn')?.addEventListener('click', async () => {
    const title=(document.getElementById('af-title').value||'').trim()
    const category=document.getElementById('af-cat').value
    const price=Number(document.getElementById('af-price').value)
    const description=(document.getElementById('af-desc').value||'').trim()
    const newIn=document.getElementById('af-newin').checked
    const pick=document.getElementById('af-pick').checked

    if (!title) { S.error='Product name is required.'; render(); return }
    if (!category) { S.error='Please select a category.'; render(); return }
    if (!price||price<=0) { S.error='Please enter a valid price.'; render(); return }
    if (!S.addImg) { S.error='Please upload a product photo.'; render(); return }

    S.saving=true; S.error=null; S.saveProgress=0; S.saveStep='Starting…'; render()

    try {
      const slug=slugify(title)
      // 1. process + upload images
      const { mediaId, w, h, widths } = await processAndUploadImages(slug, category, S.addImg.file, (step, prog) => {
        S.saveStep=step; S.saveProgress=prog; render()
      })

      // 2. update products.json
      S.saveStep='Saving product data…'; S.saveProgress=0.85; render()
      S.products.products.push({ slug, source:'instore', category, price, title, images:[`local/${slug}.jpg`], newIn, pick, occasions:[], description, details:[], colours:[] })
      await saveProductsJson(`add product: ${title}`)

      // 3. update catalog.json
      S.saveStep='Updating catalogue…'; S.saveProgress=0.93; render()
      S.catalog.products.push({ slug, source:'instore', category, price, title, images:[mediaId], newIn, pick, occasions:[], description, details:[], colours:[], worn:false })
      S.catalog.media[mediaId] = { w, h, widths }
      // update category count
      const catEntry=S.catalog.categories.find(c=>c.key===category)
      if (catEntry) catEntry.count=(catEntry.count||0)+1
      await saveCatalogJson(`add product: ${title}`)

      S.msg=`"${title}" added! Your site will rebuild in ~2 minutes.`
      S.addImg=null; S.addForm={}; S.tab='products'; S.saving=false; S.saveProgress=1
      render()
    } catch(e) {
      S.error='Failed: '+e.message; S.saving=false; render()
    }
  })
}

// ---- SETTINGS ----
function bindSettingsTab() {
  document.getElementById('s-change-pass')?.addEventListener('click', async () => {
    const p1=document.getElementById('s-np1').value, p2=document.getElementById('s-np2').value
    if (p1.length<8) { S.error='Password must be at least 8 characters.'; render(); return }
    if (p1!==p2) { S.error='Passwords do not match.'; render(); return }
    setStoredHash(await sha256(p1)); markPassChanged()
    S.error=null; S.msg='Password updated!'; render()
  })
  document.getElementById('s-save-tok')?.addEventListener('click', ()=>{
    const tok=document.getElementById('s-tok').value.trim()
    if (!tok) { S.error='Please enter a token.'; render(); return }
    setToken(tok); S.msg='GitHub token saved!'; S.error=null; render()
  })
  document.getElementById('s-logout')?.addEventListener('click', ()=>{
    clearAuth(); S.products=null; S.catalog=null; S.view='login'; render()
  })
}

// ---- MODAL ----
function bindModal() {
  document.getElementById('modal-cancel')?.addEventListener('click', ()=>{ S.deleteConfirm=null; render() })
  document.getElementById('modal-bg')?.addEventListener('click', e=>{ if(e.target.id==='modal-bg'){S.deleteConfirm=null;render()} })
  document.getElementById('modal-confirm')?.addEventListener('click', async () => {
    const slug=S.deleteConfirm; S.deleteConfirm=null; S.saving=true; render()
    try {
      S.products.products=S.products.products.filter(p=>p.slug!==slug)
      S.catalog.products=S.catalog.products.filter(p=>p.slug!==slug)
      const catKey=S.catalog.products.find(p=>p.category) // category of remaining
      // just recount all categories
      S.catalog.categories.forEach(c=>{ c.count=S.catalog.products.filter(p=>p.category===c.key).length })
      await saveProductsJson(`delete product: ${slug}`)
      await saveCatalogJson(`delete product: ${slug}`)
      S.msg='Product deleted. Site will rebuild in ~2 minutes.'
    } catch(e) { S.error='Delete failed: '+e.message }
    S.saving=false; render()
  })
}

// =====================================================================
// INIT
// =====================================================================
async function init() {
  if (isAuthed() && getToken()) {
    S.view='dashboard'; S.loading=true; render()
    try { await loadProducts() } catch(e) { S.error='Could not load products: '+e.message }
    S.loading=false; render()
  } else { render() }
}

init()
</script>
